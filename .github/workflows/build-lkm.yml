name: Build AVD LKMs

# Builds kernelsu.ko for every AVD kernel in .github/avd-targets.json against that kernel's
# exact kernel/common source, plus the host tools (ksud, ksuinit) used to patch ramdisk.img.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: KernelSU project
        type: choice
        options: [kernelsu, kernelsu-next, kernelsu-next-susfs, finasu]
        default: kernelsu
      ref:
        # No default: each project uses its own tags (kernelsu v3.3.1, kernelsu-next v3.4.2,
        # finasu v1.5.0). kernelsu-next-susfs builds a branch of the KernelSU-Next fork in the
        # SUSFS_FORK repository variable, default leemikepop/KernelSU-Next (e.g. susfs-x64-avd).
        description: Upstream tag, branch or commit (e.g. v3.3.1 for kernelsu, v3.4.2 for kernelsu-next, v1.5.0 for finasu, susfs-x64-avd for kernelsu-next-susfs)
        required: true
      target:
        description: Target id from avd-targets.json, or "all"
        default: all
  # PRs build every target with the default inputs (kernelsu @ v3.3.1).
  pull_request:
    paths:
      - .github/avd-targets.json
      - .github/workflows/build-lkm.yml
      - patches/**
      - scripts/build-lkm.sh
      - scripts/build-target.sh
      - scripts/fetch_kernel_source.py
      - scripts/x86_icall_windows.py
      - scripts/apk_cert.py
  workflow_call:
    inputs:
      variant: { type: string, required: true }
      ref: { type: string, required: true }
      target: { type: string, default: all }

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      upstream: ${{ steps.m.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          TARGET: ${{ inputs.target || 'all' }}
          VARIANT: ${{ inputs.variant || 'kernelsu' }}
        run: |
          case "$VARIANT" in
            kernelsu) echo "upstream=tiann/KernelSU" >> "$GITHUB_OUTPUT" ;;
            kernelsu-next) echo "upstream=KernelSU-Next/KernelSU-Next" >> "$GITHUB_OUTPUT" ;;
            # KernelSU-Next + the x86_64 SUSFS guard LKM, from a fork branch (preview builds).
            kernelsu-next-susfs) echo "upstream=${{ vars.SUSFS_FORK || 'leemikepop/KernelSU-Next' }}" >> "$GITHUB_OUTPUT" ;;
            # FinaSU: a KernelSU fork with its own ksud/ksuinit (built from source, like kernelsu-next).
            finasu) echo "upstream=LyraVoid/FinaSU" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown variant $VARIANT"; exit 1 ;;
          esac
          m=$(jq -c --arg t "$TARGET" '[.targets[] | select($t == "all" or .id == $t) | {id, kmi}]' .github/avd-targets.json)
          [ "$m" != "[]" ] || { echo "no target matches '$TARGET'"; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  lkm:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: lkm (${{ matrix.target.id }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.upstream }}
          ref: ${{ inputs.ref || 'v3.3.1' }}
          path: upstream
          fetch-depth: 0          # version number = 30000 + commit count
      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/${{ matrix.target.id }}/common-*.tar.gz
          key: kernel-src-${{ matrix.target.id }}-${{ hashFiles('.github/avd-targets.json') }}
          restore-keys: kernel-src-${{ matrix.target.id }}-
      # FinaSU's own kernel modules trust its manager through the second signature slot, which
      # FinaSU's release CI fills from its private keystore. The certificate itself is public:
      # take it from the official manager APK of the same release, as that release build does.
      # Without it the module only trusts the upstream KernelSU key and the FinaSU manager shows
      # "Not installed" even though root works.
      - name: Trusted manager signature (finasu)
        if: (inputs.variant || 'kernelsu') == 'finasu'
        env:
          GH_TOKEN: ${{ github.token }}
          UP: ${{ needs.setup.outputs.upstream }}
          REF: ${{ inputs.ref }}
        run: |
          mgr="$RUNNER_TEMP/manager"; mkdir -p "$mgr"
          if ! gh release download "$REF" -R "$UP" -p '*.apk' -D "$mgr"; then
            echo "::warning::$UP has no release $REF; taking the manager signature from its latest release"
            gh release download -R "$UP" -p '*.apk' -D "$mgr"
          fi
          ls -la "$mgr"
          sig=$(python3 scripts/apk_cert.py "$mgr"/*.apk)
          read -r size hash <<< "$sig"
          # Cross-check with Google's apksigner where the runner image has it.
          apksigner=$(ls "${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$apksigner" ]; then
            for apk in "$mgr"/*.apk; do
              # The certificate lines vary between versions ("Signer #1 ...", "Signer (minSdkVersion=..)
              # ..."), so require our digest among the certificate digests apksigner lists.
              out=$("$apksigner" verify -v --print-certs "$apk" 2>&1 | grep -v '^WARNING' || true)
              echo "$out"
              grep -qi "certificate SHA-256 digest: $hash" <<< "$out" \
                || { echo "::error::apksigner does not list $hash as a certificate of $(basename "$apk")"; exit 1; }
            done
            echo "apksigner agrees: $hash"
          else
            echo "::warning::apksigner not found; skipped the cross-check"
          fi
          echo "trusted FinaSU manager certificate: size=$size sha256=$hash"
          echo "KSU_MAKE_ARGS=KSU_EXPECTED_SIZE2=$size KSU_EXPECTED_HASH2=$hash KSU_SECOND_SIGNATURE_RELEASE=1" >> "$GITHUB_ENV"
      - name: Build kernelsu.ko
        run: |
          bash scripts/build-target.sh "${{ matrix.target.id }}" "${{ inputs.variant || 'kernelsu' }}" \
            "$GITHUB_WORKSPACE/upstream" "$(git -C upstream rev-parse HEAD)" "$RUNNER_TEMP/work"
          out="$RUNNER_TEMP/work/${{ matrix.target.id }}/out-${{ inputs.variant || 'kernelsu' }}"
          mkdir -p dist
          cp "$out/kernelsu.ko" "dist/${{ matrix.target.id }}_kernelsu.ko"
          if [ -f "$out/susfs_guard_lkm.ko" ]; then
            cp "$out/susfs_guard_lkm.ko" "dist/${{ matrix.target.id }}_susfs_guard_lkm.ko"
          fi
          cp "$RUNNER_TEMP/work/${{ matrix.target.id }}/target.env" "dist/${{ matrix.target.id }}.env"
      - uses: actions/upload-artifact@v4
        with:
          name: lkm-${{ matrix.target.id }}
          path: dist/*
          if-no-files-found: error

  # KernelSU publishes host ksud + ksuinit-x86_64 in its releases; reuse them for tags.
  host-tools-kernelsu:
    if: (inputs.variant || 'kernelsu') == 'kernelsu'
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'v3.3.1' }}
        run: |
          mkdir -p dist && cd dist
          gh release download "$REF" -R tiann/KernelSU \
            -p 'ksud-x86_64-pc-windows-gnu.exe' -p 'ksud-x86_64-unknown-linux-musl' \
            -p 'ksud-x86_64-apple-darwin' -p 'ksud-aarch64-apple-darwin' -p 'ksud-aarch64-unknown-linux-musl' \
            -p 'ksuinit-x86_64' \
            || { echo "::error::host tools need a KernelSU release tag (got '$REF')"; exit 1; }
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools
          path: dist/*

  # KernelSU-Next and FinaSU do not ship host ksud / ksuinit-x86_64 in releases: build them like
  # their upstream CI does, from the same repository and ref as kernelsu.ko (so also from the fork
  # for kernelsu-next-susfs). Every variant except plain kernelsu takes this path.
  ksuinit-kernelsu-next:
    if: (inputs.variant || 'kernelsu') != 'kernelsu'
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.upstream }}
          ref: ${{ inputs.ref || 'v3.3.1' }}
          fetch-depth: 0
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Build ksuinit (x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          rustup update stable && rustup target add x86_64-linux-android
          LLVM_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CLANG_PATH="$LLVM_BIN/x86_64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CLANG_PATH"
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-x86_64-android.a"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cd userspace/ksuinit && cargo build --target=x86_64-linux-android --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # FinaSU is a cargo workspace, so the binary lands in the workspace-root target/,
          # not userspace/ksuinit/target/. Locate it wherever cargo put it.
          ksuinit=$(find "$GITHUB_WORKSPACE" -path "*/x86_64-linux-android/release/ksuinit" -type f | head -1)
          [ -n "$ksuinit" ] || { echo "::error::ksuinit binary not found after build"; exit 1; }
          cp "$ksuinit" "$GITHUB_WORKSPACE/dist/ksuinit-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools-ksuinit
          path: dist/*

  ksud-kernelsu-next:
    if: (inputs.variant || 'kernelsu') != 'kernelsu'
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-pc-windows-gnu, os: ubuntu-latest }
          - { triple: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { triple: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { triple: x86_64-apple-darwin, os: macos-latest }
          - { triple: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    name: ksud (${{ matrix.triple }})
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.upstream }}
          ref: ${{ inputs.ref || 'v3.3.1' }}
          fetch-depth: 0          # ksud version = 30000 + commit count
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.triple }}
          RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1
      - name: Assemble LKM bootstrap
        run: |
          if [ -f userspace/ksud/src/lkm_image_bootstrap.S ]; then
            clang --target=aarch64-linux-gnu -c -nostdlib \
              -o userspace/ksud/.lkm_image_bootstrap.o userspace/ksud/src/lkm_image_bootstrap.S
          fi
      - name: Build ksud
        run: |
          CROSS_NO_WARNINGS=0 cross build --target ${{ matrix.triple }} --release --manifest-path ./userspace/ksud/Cargo.toml
          mkdir -p dist
          ext=""; [ "${{ matrix.triple }}" = x86_64-pc-windows-gnu ] && ext=.exe
          # FinaSU is a cargo workspace, so the binary lands in the workspace-root target/,
          # not userspace/ksud/target/. Locate it wherever cargo/cross put it.
          ksud=$(find "$GITHUB_WORKSPACE" -path "*/${{ matrix.triple }}/release/ksud$ext" -type f | head -1)
          [ -n "$ksud" ] || { echo "::error::ksud binary not found after build"; exit 1; }
          cp "$ksud" "dist/ksud-${{ matrix.triple }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools-ksud-${{ matrix.triple }}
          path: dist/*
